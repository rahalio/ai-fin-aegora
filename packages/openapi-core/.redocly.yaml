apis:
  identity:
    root: src/identity.yaml
  events:
    root: src/events.yaml
  offers:
    root: src/offers.yaml
  alerts:
    root: src/alerts.yaml
  holds:
    root: src/holds.yaml
  cases:
    root: src/cases.yaml
  policies:
    root: src/policies.yaml
  models:
    root: src/models.yaml
  audits:
    root: src/audits.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  operation-summary: off
  info-license-strict: off
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
