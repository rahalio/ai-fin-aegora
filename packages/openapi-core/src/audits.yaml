openapi: 3.1.0
info:
  title: Aegora Audits API
  version: 0.1.0
  description: Period purpose-audit exports (BR-11).
  x-domain: audits
  license:
    name: Proprietary
servers:
  - url: https://api.aegora.local
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: Audits
paths:
  /v1/audits/exports:
    get:
      operationId: listAuditExports
      tags: [Audits]
      x-repository: Audit
      x-dynamodb:
        entityType: AUDIT
        pkPatternTemplate: "AUDIT#${auditId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
        filterFields: [status]
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Exports
          content:
            application/json:
              schema:
                $ref: ./audits.schemas.yaml#/components/schemas/AuditListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createAuditExport
      tags: [Audits]
      x-repository: Audit
      x-dynamodb:
        entityType: AUDIT
        pkPatternTemplate: "AUDIT#${auditId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./audits.schemas.yaml#/components/schemas/AuditExportCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./audits.schemas.yaml#/components/schemas/AuditResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/audits/exports/{auditId}:
    get:
      operationId: getAuditExport
      tags: [Audits]
      x-repository: Audit
      x-dynamodb:
        entityType: AUDIT
        pkPatternTemplate: "AUDIT#${auditId}"
        skPatternTemplate: METADATA
        pkPattern: entity
      parameters:
        - name: auditId
          in: path
          required: true
          schema:
            $ref: ./audits.schemas.yaml#/components/schemas/AuditId
      responses:
        '200':
          description: Export
          content:
            application/json:
              schema:
                $ref: ./audits.schemas.yaml#/components/schemas/AuditResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
