openapi: 3.1.0
info:
  title: Aegora Alerts API
  version: 0.1.0
  description: Protect-channel geo and behavioural alerts (BR-3).
  x-domain: alerts
  license:
    name: Proprietary
servers:
  - url: https://api.aegora.local
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: Alerts
paths:
  /v1/alerts:
    get:
      operationId: listAlerts
      tags: [Alerts]
      x-repository: Alert
      x-dynamodb:
        entityType: ALERT
        pkPatternTemplate: "ALERT#${alertId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
        gsi1PKPatternTemplate: "STATUS#${status}"
        gsi1SKPatternTemplate: "ALERT#${alertId}"
        filterFields: [status, alertType]
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            $ref: ./alerts.schemas.yaml#/components/schemas/AlertStatus
        - name: customerId
          in: query
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/CustomerId
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                $ref: ./alerts.schemas.yaml#/components/schemas/AlertListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createAlert
      tags: [Alerts]
      x-repository: Alert
      x-dynamodb:
        entityType: ALERT
        pkPatternTemplate: "ALERT#${alertId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./alerts.schemas.yaml#/components/schemas/ProtectAlert
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./alerts.schemas.yaml#/components/schemas/AlertResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/alerts/{alertId}:
    get:
      operationId: getAlert
      tags: [Alerts]
      x-repository: Alert
      x-dynamodb:
        entityType: ALERT
        pkPatternTemplate: "ALERT#${alertId}"
        skPatternTemplate: METADATA
        pkPattern: entity
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            $ref: ./alerts.schemas.yaml#/components/schemas/AlertId
      responses:
        '200':
          description: Alert
          content:
            application/json:
              schema:
                $ref: ./alerts.schemas.yaml#/components/schemas/AlertResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/alerts/{alertId}/suppress:
    post:
      operationId: suppressAlert
      tags: [Alerts]
      x-repository: Alert
      x-dynamodb:
        entityType: ALERT
        pkPatternTemplate: "ALERT#${alertId}"
        skPatternTemplate: METADATA
        pkPattern: entity
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            $ref: ./alerts.schemas.yaml#/components/schemas/AlertId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./alerts.schemas.yaml#/components/schemas/AlertAction
      responses:
        '200':
          description: Suppressed
          content:
            application/json:
              schema:
                $ref: ./alerts.schemas.yaml#/components/schemas/AlertResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/alerts/{alertId}/escalate:
    post:
      operationId: escalateAlert
      tags: [Alerts]
      x-repository: Alert
      x-dynamodb:
        entityType: ALERT
        pkPatternTemplate: "ALERT#${alertId}"
        skPatternTemplate: METADATA
        pkPattern: entity
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            $ref: ./alerts.schemas.yaml#/components/schemas/AlertId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./alerts.schemas.yaml#/components/schemas/AlertAction
      responses:
        '200':
          description: Escalated
          content:
            application/json:
              schema:
                $ref: ./alerts.schemas.yaml#/components/schemas/AlertResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
